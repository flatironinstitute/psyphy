repos:
  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Type checking with mypy.
  #
  # This hook is the single definition of what "mypy passes" means for psyphy:
  # CI runs this same hook rather than its own mypy invocation, so the two
  # cannot drift apart. Four things here are deliberate, because each was a
  # real defect beforehand.
  #
  # 1. `rev` is a genuine pin, and it must move together with the `mypy==` pin
  #    in pyproject.toml's `dev` extra. mypy's inference differs between
  #    releases in ways that change whether correct code is accepted, so a
  #    stale or floating version makes a green run a statement about the
  #    checker rather than about the code.
  # 2. jax and numpy are installed into the hook's environment and
  #    `--no-site-packages` is NOT passed. Without the real libraries every
  #    `jnp.ndarray` in psyphy collapses to `Any`, which made this hook strict
  #    about our own code and blind to the library it is written against.
  #    They are pinned for the same reason as `rev`.
  # 3. `args: []` clears the hook's defaults so that every setting comes from
  #    `[tool.mypy]` in pyproject.toml, including `python_version` and
  #    `ignore_missing_imports`. One config file, one meaning.
  # 4. `pass_filenames: false` stops pre-commit handing mypy only the staged
  #    files; mypy instead reads `files` from pyproject.toml and checks the
  #    whole project. Partial checks were how a type error could pass the
  #    commit and only appear once an unrelated file was touched. `files`
  #    below now only decides *whether* the hook runs, not what it checks.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: ["numpy==2.5.2", "jax==0.11.0"]
        args: []
        pass_filenames: false
        files: ^src/psyphy/|^tests/

  # Prose language rules for src/ and docs/ (see linting/check_language.py)
  - repo: local
    hooks:
      - id: check-language
        name: prose language check
        entry: python linting/check_language.py
        language: system
        files: \.(py|md)$
        exclude: ^linting/check_language\.py$
        verbose: true
      - id: check-punctuation
        name: typographic punctuation check
        entry: python linting/check_punctuation.py
        language: system
        files: \.(py|md)$
        exclude: ^linting/check_punctuation\.py$
      - id: check-docstring-shapes
        name: docstring array-shape check
        entry: python linting/check_docstring_shapes.py
        language: system
        files: ^src/.*\.py$

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
