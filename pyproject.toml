[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "psyphy"
version = "0.0.5"

authors = [
  { name = "Hanna Dettki" },
  { name = "Alex Williams" }

]

maintainers = [
  { name = "Hanna Dettki" }
]

description = "Adaptive Trial Placement for Psychophysical Experiments"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "jax>=0.4.28",
  "optax>=0.2.4",
  "numpy>=1.22",
  "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "mypy>=1.0",
  "pre-commit>=3.0",
]
# Toolchain for `mkdocs build --strict`. Kept separate from `examples` so CI's
# docs job does not have to install JupyterLab on every push to main.
#
# The `<2` bound is deliberate: MkDocs 2.0 removes the plugin system outright
# (mkdocs-material warns about this at build time, and states there is no
# migration path). This site depends on the `search` and `mkdocstrings`
# plugins, so it cannot build under 2.x. Revisit when the ecosystem settles.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]>=1.0",
  "pymdown-extensions>=11.0",
]
# Plotting backend for psyphy.viz. Kept separate from `examples` so a user who
# only wants to draw covariance ellipses does not also install JupyterLab.
viz = [
  "matplotlib>=3.5",
]
# Needed only to *run* the example scripts under docs/examples/ and regenerate
# their figures. The committed plots mean the site builds without these.
examples = [
  "matplotlib>=3.5",
  "seaborn>=0.13",
  "jupyterlab>=4.0",
  "psyphy[progress]",   # self-reference: keeps the tqdm pin in one place
]
# Gradient-based MCMC (NUTSSampler). Soft dependency: the class is always
# importable and only .fit() raises if blackjax is missing.
#
# The `>=1.4` floor is deliberate and is the whole reason this is pinned on both
# sides. BlackJAX has a hard discontinuity at 1.4: releases <=1.3 require
# `jax>=0.4.16` *and* the deprecated `jaxopt`, while >=1.4 require `jax>=0.9.0`.
# An unbounded `blackjax>=1.0` straddles that split, so the resolved jax version
# depends on what the resolver happens to pick -- which is non-reproducible
# between a laptop and a CUDA cluster, and is what stalled this work in May 2026.
# The `<2` bound reserves the right to re-check when 2.x lands.
#
# Note this extra raises floors for core deps: blackjax 1.4+ wants jax>=0.9.0,
# numpy>=1.25 and scipy>=1.13, all above psyphy's own declared minimums. That is
# acceptable in an extra, but any lowest-version resolution test must exclude it.
# The python_version marker is upstream's constraint, not a choice: blackjax 1.4+
# declares requires-python >=3.11 (1.3 allowed >=3.9). Without the marker the
# resolution is unsatisfiable on psyphy's declared 3.10 floor and `uv lock` fails.
sampling = [
  'blackjax>=1.4,<2; python_version >= "3.11"',
]
# Progress bars for long fits. `MAPOptimizer` and `NUTSSampler` both default to
# `show_progress=True` and get their bar from `from tqdm.auto import tqdm` inside a
# suppressed try/except, so without this extra the default is silently a no-op -- a long
# GPU run prints nothing and looks hung. Kept as an extra rather than a core dependency
# because it is purely a UI feature and the code degrades gracefully without it.
progress = [
  "tqdm>=4.66",
]
# MCMC convergence diagnostics (MCMCPosterior.to_arviz, R-hat, ESS).
#
# `>=1.0` is required, not merely preferred: ArviZ 1.0 replaced InferenceData
# with xarray's DataTree, and `to_arviz()` returns and is accessed as a DataTree
# (`idata["posterior"]`, `list(idata.children)`). Measured on 0.23.4, five tests
# in tests/test_mcmc_posterior.py fail and each of those access patterns raises
# (KeyError / AttributeError / TypeError). All 17 pass on 1.3.0.
# Likewise a marker, and a steeper one: EVERY arviz 1.x requires Python >=3.12
# (0.23.4, the last 0.x, allowed >=3.10). Since to_arviz() only works on 1.x
# (see below), the diagnostics extra is inherently Python 3.12+. On 3.10/3.11 the
# extra resolves to nothing and to_arviz() raises with an explanation.
diagnostics = [
  'arviz>=1.0; python_version >= "3.12"',
]
# GPU (NVIDIA/CUDA) support, e.g. for running the example scripts on the
# Flatiron cluster. `jax[cuda12]` pulls in jaxlib's CUDA plugin plus matching
# nvidia-*-cu12 wheels; JAX bundles its own CUDA/cuDNN runtime this way, so no
# system CUDA/cuDNN module should be loaded alongside it -- doing so puts an
# older system libcusparse/libcudnn ahead of the bundled ones on
# LD_LIBRARY_PATH and breaks GPU detection (`module load python` is enough).
#
# There is no equivalent extra for Apple Silicon GPUs: JAX's Metal backend
# does not support float64, which the WPPM examples require for their
# published-precision comparisons, so Mac users run CPU-only. Third-party
# Metal backends exist (jax-mps / applejax) but are not wired up here.
cuda = [
  "jax[cuda12]>=0.4.28",
]

[project.urls]
Homepage = "https://flatironinstitute.github.io/psyphy"
Repository = "https://github.com/flatironinstitute/psyphy"
Issues = "https://github.com/flatironinstitute/psyphy/issues"
Changelog = "https://flatironinstitute.github.io/psyphy/changelog/"

[tool.hatch.build.targets.wheel]
packages = ["src/psyphy"]

[tool.hatch.build.targets.sdist]
include = ["src/psyphy", "README.md", "LICENSE.md", "CHANGELOG.md", "tests"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# Ruff >=0.16 formats Python code blocks inside Markdown. The docs pages embed
# snippets from docs/examples/*.py via pymdownx.snippets' `--8<--` includes, so
# the code is already formatted at its source; letting the formatter rewrite the
# rendered copies would only churn the prose files and desync them from CI,
# which lints src/ and tests/ only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "NPY",   # NumPy-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "ARG",   # Unused arguments (prototyping phase)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]  # Allow unused args and asserts in tests
# E402: the blackjax/arviz importorskip guards must run before psyphy imports,
# so module-level imports below them are deliberate.
"tests/test_nuts_sampler.py" = ["ARG", "S101", "E402"]
"tests/test_mcmc_posterior.py" = ["ARG", "S101", "E402"]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"docs/**/*.py" = ["ARG", "T201"]  # Allow print statements in examples

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Disabled for JAX compatibility
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src/psyphy", "tests"]
exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
]

# Ignore third-party packages that have compatibility issues
[[tool.mypy.overrides]]
module = [
    "jax.*",
    "jaxlib.*",
    "optax.*",
]
ignore_errors = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
