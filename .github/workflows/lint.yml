name: Lint, Type Check, and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Ruff) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Format check with Ruff
        run: |
          ruff format --check src/ tests/

  type-check:
    name: Type check (mypy) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e .

      - name: Type check with mypy
        run: |
          mypy src/psyphy tests/
        continue-on-error: true  # Preserve existing behavior

  # The floor test: deliberately pinned to psyphy's declared minimums, and
  # deliberately WITHOUT the sampling/diagnostics extras. blackjax>=1.4 requires
  # jax>=0.9, which the jax==0.4.28 pin below forbids, so the extras cannot be
  # added here -- the `tests-sampling` job covers them instead. Consequence to be
  # aware of rather than "fix": the 20 tests in tests/test_nuts_sampler.py (gated
  # by a module-level pytest.importorskip) and the 5 arviz-gated tests in
  # tests/test_mcmc_posterior.py all SKIP in this job. That is intended.
  tests:
    name: Tests (pytest) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install jax==0.4.28 jaxlib==0.4.28 optax==0.2.4
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/

  # Covers what the pinned `tests` job structurally cannot: the sampling and
  # diagnostics extras. Pinned to a single Python version on purpose --
  #   * blackjax >=1.4   needs jax >=0.9
  #   * jax/jaxlib >=0.11 needs Python >=3.12   (0.9-0.10 allowed 3.11)
  #   * every arviz 1.x   needs Python >=3.12   (0.23.4, the last 0.x, allowed 3.10)
  # so 3.12 is the lowest interpreter on which this stack resolves at all. Both
  # extras carry python_version markers for exactly that reason, which is why the
  # verification step below is not redundant: on a too-old Python the markers make
  # the extras resolve to NOTHING, pip exits 0, and every test silently skips.
  # The explicit import turns that failure mode into a red build.
  tests-sampling:
    name: Tests (pytest) - sampling + diagnostics extras - Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[sampling,diagnostics]"

      - name: Verify the extras actually installed, and record what resolved
        run: |
          python -c "import jax, jaxlib, blackjax, arviz, numpy, scipy; print('jax', jax.__version__, '| jaxlib', jaxlib.__version__, '| blackjax', blackjax.__version__, '| arviz', arviz.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Run tests
        run: |
          pytest tests/ -ra
